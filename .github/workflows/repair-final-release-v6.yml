name: Repair and Build Final APK V6

on:
  push:
    paths:
      - '.github/workflows/repair-final-release-v6.yml'

permissions:
  contents: write

jobs:
  repair-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      CI: 'true'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Apply proven V4 fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/repair-final-release-v4.yml').read_text()
          marker = '      - name: Apply final release fixes\n'
          start = text.index(marker)
          run_at = text.index('        run: |\n', start) + len('        run: |\n')
          end = text.index('\n      - name: Resolve pinned dependencies', run_at)
          block = text[run_at:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/apply-v4.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/apply-v4.sh

      - name: Preserve serialized OCR layout geometry
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/repair-final-release-v5.yml').read_text()
          marker = '      - name: Preserve serialized OCR layout geometry\n'
          start = text.index(marker)
          run_at = text.index('        run: |\n', start) + len('        run: |\n')
          end = text.index('\n      - name: Resolve pinned dependencies', run_at)
          block = text[run_at:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/apply-v5-layout.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/apply-v5-layout.sh

      - name: Preserve late diverse date evidence
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('lib/domain/medicine_date_intelligence_core.dart')
          text = p.read_text()
          old = "  final sourceFrames = frames.take(16).toList(growable: false);"
          new = "  final sourceFrames = selectOfflineEvidenceFrames(\n    frames,\n    maxFrames: 16,\n  ).toList(growable: false);"
          if text.count(old) != 1:
              raise SystemExit(f'late-evidence patch target count={text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          print('Bounded date reasoning now uses diversity-aware frame selection.')
          PY
          git diff --check

      - name: Resolve pinned dependencies
        run: flutter pub get

      - name: Static safety gate
        run: dart analyze lib test tool third_party/lib_llama_cpp/lib

      - name: Targeted regression gate
        run: >-
          flutter test --reporter expanded
          test/medicine_extraction_hardening_v18_test.dart
          test/medicine_extraction_hardening_v30_test.dart
          test/medicine_extraction_hardening_v31_test.dart
          test/medicine_ocr_semantic_hardening_v22_test.dart
          test/medicine_ocr_semantic_hardening_v23_test.dart
          test/medicine_extraction_hardening_v28_test.dart
          test/medicine_date_edge_cases_v21_test.dart
          test/medicine_spatial_assignment_v24_test.dart
          test/medicine_review_evidence_normalization_test.dart
          test/offline_evidence_budget_test.dart

      - name: Full pharmacy regression gate
        run: flutter test --reporter expanded

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify release APK
        shell: bash
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk | tee build/app/outputs/flutter-apk/app-release.apk.sha256
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload verified release APK
        uses: actions/upload-artifact@v4
        with:
          name: Aaris-Pharmacy-Final-Release-APK
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Persist verified fixes and remove one-shot workflows
        shell: bash
        run: |
          rm -f .github/workflows/repair-final-release.yml
          rm -f .github/workflows/repair-final-release-v2.yml
          rm -f .github/workflows/repair-final-release-v3.yml
          rm -f .github/workflows/repair-final-release-v4.yml
          rm -f .github/workflows/repair-final-release-v5.yml
          rm -f .github/workflows/repair-final-release-v6.yml
          rm -f .github/workflows/diagnose-v18-release.yml
          git config user.name 'aaris-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/domain/medicine_understanding.dart \
                  lib/domain/medicine_semantic_roles.dart \
                  lib/domain/medicine_date_intelligence.dart \
                  lib/domain/medicine_date_intelligence_core.dart \
                  lib/domain/medicine_resolution_v2.dart \
                  .github/workflows/repair-final-release.yml \
                  .github/workflows/repair-final-release-v2.yml \
                  .github/workflows/repair-final-release-v3.yml \
                  .github/workflows/repair-final-release-v4.yml \
                  .github/workflows/repair-final-release-v5.yml \
                  .github/workflows/repair-final-release-v6.yml \
                  .github/workflows/diagnose-v18-release.yml
          git commit -m 'Fix OCR and date regressions for final release [skip ci]'
          git push origin HEAD:main
