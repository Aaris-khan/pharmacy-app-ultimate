name: Repair and Build Final APK

on:
  push:
    paths:
      - '.github/workflows/repair-final-release.yml'

permissions:
  contents: write

jobs:
  repair-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      CI: 'true'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Apply release regression fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one patch target, found {count}')
              p.write_text(text.replace(old, new, 1))

          # 1) A merged two-date row must never let the legacy adjacency parser
          # hand the same first date to both MFG and EXP.
          replace_once(
              'lib/domain/medicine_understanding.dart',
              """    final value = parseMedicineDateText(next)?.value;\n    if (value != null) {\n      final base = nextIndex == index + 1 ? .89 : .84;\n      return _ParsedDate(value, value.length == 7 ? base : base + .02);\n    }\n""",
              """    final adjacentMatches = extractMedicineDateMatches(\n      next,\n      allowCompact: true,\n    );\n    if (adjacentMatches.length != 1) continue;\n    final value = adjacentMatches.single.date.value;\n    final base = nextIndex == index + 1 ? .89 : .84;\n    return _ParsedDate(value, value.length == 7 ? base : base + .02);\n""",
          )

          # 2) Strength values are canonical display facts; unit casing must be
          # stable (mEq -> meq) regardless of OCR surface casing.
          replace_once(
              'lib/domain/medicine_understanding.dart',
              """        )\n        .trim();\n    if (!values.map(_strengthKey).contains(_strengthKey(value))) {\n""",
              """        )\n        .toLowerCase()\n        .trim();\n    if (!values.map(_strengthKey).contains(_strengthKey(value))) {\n""",
          )

          # 3) A pure dosage-form heading is presentation, never a competing
          # medicine brand. Preserve a real prefix such as CALPOL.
          replace_once(
              'lib/domain/medicine_semantic_roles.dart',
              """      r'\\b(?:tablets?|capsules?|syrup|suspension|solution|injection|cream|ointment|gel|lotion|drops?|spray|inhaler|powder|sachets?)\\b',\n""",
              """      r'\\b(?:oral\\s+(?:suspension|solution)|tablets?|capsules?|syrup|suspension|solution|injection|cream|ointment|gel|lotion|drops?|spray|inhaler|powder|sachets?)\\b',\n""",
          )

          # 4) Reuse the already-hardened spatial label/value assignment inside
          # date intelligence whenever geometry exists. This preserves MFG/EXP
          # ownership for two-column headers instead of relying on flattened OCR.
          replace_once(
              'lib/domain/medicine_date_intelligence.dart',
              """import 'offline_evidence_graph.dart';\n""",
              """import 'offline_evidence_graph.dart';\nimport 'spatial_traceability.dart';\n""",
          )

          replace_once(
              'lib/domain/medicine_date_intelligence_core.dart',
              """}) {\n  final evidence = <MedicineDateEvidence>[];\n""",
              """}) {\n  final sourceFrames = frames.take(16).toList(growable: false);\n  final evidence = <MedicineDateEvidence>[];\n""",
          )

          replace_once(
              'lib/domain/medicine_date_intelligence_core.dart',
              """  final graph = buildOfflineEvidenceGraph(frames, maxFrames: 16);\n  final independentFrames = graph.groups.isEmpty\n      ? frames.take(16)\n      : graph.groups.map((group) => group.representative);\n""",
              """  final spatial = inferSpatialTraceability(sourceFrames);\n  void rememberSpatial(\n    SpatialTraceabilityField? hint,\n    MedicineDateRole role,\n  ) {\n    if (hint == null ||\n        hint.conflicted ||\n        hint.value.trim().isEmpty ||\n        hint.confidence < .80) {\n      return;\n    }\n    final parsed = parseMedicineDateText(hint.value);\n    if (parsed == null) return;\n    remember(\n      MedicineDateEvidence(\n        date: parsed,\n        role: role,\n        confidence: hint.confidence.clamp(.80, .99).toDouble(),\n        support: max(1, hint.support),\n        explicitLabel: true,\n      ),\n    );\n  }\n\n  rememberSpatial(spatial.mfg, MedicineDateRole.manufacturing);\n  rememberSpatial(spatial.expiry, MedicineDateRole.expiry);\n\n  final graph = buildOfflineEvidenceGraph(sourceFrames, maxFrames: 16);\n  final independentFrames = graph.groups.isEmpty\n      ? sourceFrames\n      : graph.groups.map((group) => group.representative);\n""",
          )

          print('Applied final release regression fixes successfully.')
          PY

          git diff --check
          git diff -- lib/domain/medicine_understanding.dart lib/domain/medicine_semantic_roles.dart lib/domain/medicine_date_intelligence.dart lib/domain/medicine_date_intelligence_core.dart

      - name: Resolve pinned dependencies
        run: flutter pub get

      - name: Static safety gate
        run: dart analyze lib test tool third_party/lib_llama_cpp/lib

      - name: Targeted regression gate
        run: >-
          flutter test --reporter expanded
          test/medicine_extraction_hardening_v18_test.dart
          test/medicine_extraction_hardening_v30_test.dart
          test/medicine_extraction_hardening_v31_test.dart
          test/medicine_ocr_semantic_hardening_v22_test.dart
          test/medicine_ocr_semantic_hardening_v23_test.dart

      - name: Full pharmacy regression gate
        run: flutter test --reporter expanded

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify release APK
        shell: bash
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk | tee build/app/outputs/flutter-apk/app-release.apk.sha256
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload verified release APK
        uses: actions/upload-artifact@v4
        with:
          name: Aaris-Pharmacy-Final-Release-APK
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Persist verified fixes and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/repair-final-release.yml
          git config user.name 'aaris-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/domain/medicine_understanding.dart \
                  lib/domain/medicine_semantic_roles.dart \
                  lib/domain/medicine_date_intelligence.dart \
                  lib/domain/medicine_date_intelligence_core.dart \
                  .github/workflows/repair-final-release.yml
          git commit -m 'Fix OCR and date regressions for final release [skip ci]'
          git push origin HEAD:main
