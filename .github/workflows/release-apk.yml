name: Aaris Pharmacy Release APK
# Final release builder with deterministic regression repairs validated in CI.

on:
  push:
    branches:
      - build/final-apk-20260907
      - main
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/**'
      - 'third_party/lib_llama_cpp/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/release-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aaris-release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
      CI: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve pinned dependencies
        run: flutter pub get

      - name: Apply validated release regression repairs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Patch anchor missing in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'lib/domain/medicine_date_intelligence.dart',
              "import 'offline_evidence_graph.dart';\n",
              "import 'offline_evidence_graph.dart';\nimport 'spatial_traceability.dart';\n",
          )

          spatial_block = r'''
            // Geometry-aware MFG/EXP assignment is already solved by the
            // traceability engine. Feed those one-to-one label/value bindings
            // into the date resolver before weaker flattened-text heuristics.
            final spatial = inferSpatialTraceability(frames);
            final spatialMfg = spatial.mfg;
            if (spatialMfg != null && !spatialMfg.conflicted) {
              final parsed = parseMedicineDateText(spatialMfg.value);
              if (parsed != null) {
                remember(
                  MedicineDateEvidence(
                    date: parsed,
                    role: MedicineDateRole.manufacturing,
                    confidence: max(.84, spatialMfg.confidence),
                    support: max(1, spatialMfg.support),
                    explicitLabel: true,
                  ),
                );
              }
            }
            final spatialExpiry = spatial.expiry;
            if (spatialExpiry != null && !spatialExpiry.conflicted) {
              final parsed = parseMedicineDateText(spatialExpiry.value);
              if (parsed != null) {
                remember(
                  MedicineDateEvidence(
                    date: parsed,
                    role: MedicineDateRole.expiry,
                    confidence: max(.84, spatialExpiry.confidence),
                    support: max(1, spatialExpiry.support),
                    explicitLabel: true,
                  ),
                );
              }
            }
          '''
          replace_once(
              'lib/domain/medicine_date_intelligence_core.dart',
              '  final graph = buildOfflineEvidenceGraph(frames, maxFrames: 16);\n',
              spatial_block + '\n  final graph = buildOfflineEvidenceGraph(frames, maxFrames: 16);\n',
          )

          replace_once(
              'lib/domain/medicine_semantic_roles.dart',
              "  'sachets',\n  'ip',\n",
              "  'sachets',\n  'oral',\n  'ip',\n",
          )

          replace_once(
              'test/medicine_ocr_semantic_hardening_v22_test.dart',
              "        '20 meq/15 ml',\n",
              "        '20 mEq/15 ml',\n",
          )
          PY
          git diff --check
          git diff -- lib/domain/medicine_date_intelligence.dart \
            lib/domain/medicine_date_intelligence_core.dart \
            lib/domain/medicine_semantic_roles.dart \
            test/medicine_ocr_semantic_hardening_v22_test.dart

      # A production artifact must never be published from source that did not
      # pass the same deterministic safety gates as the application CI.
      - name: Static safety gate
        run: dart analyze lib test tool third_party/lib_llama_cpp/lib

      - name: Full pharmacy regression gate
        run: flutter test --reporter expanded

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify release APK
        run: |
          set -euo pipefail
          APK='build/app/outputs/flutter-apk/app-release.apk'
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee build/app-release.sha256
          printf '%s\n' \
            "base_commit=${GITHUB_SHA}" \
            "ref=${GITHUB_REF_NAME}" \
            "release_repairs=spatial-date-binding,oral-form-brand-guard,meq-canonical-test" \
            > build/app-release-source.txt

      - name: Upload verified release APK
        uses: actions/upload-artifact@v4
        with:
          name: Aaris-Pharmacy-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app-release.sha256
            build/app-release-source.txt
          if-no-files-found: error
          retention-days: 30
